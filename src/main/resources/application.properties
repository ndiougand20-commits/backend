spring.application.name=backend

# PostgreSQL datasource
spring.datasource.url=jdbc:postgresql://localhost:5432/rezo_db
spring.datasource.username=rezo_user
spring.datasource.password=rezo987_password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# OpenAPI / Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=alpha

# JWT
rezo.jwt.secret=rezo_secret_key_must_be_at_least_32_chars_long_for_hs256
rezo.jwt.expiration-ms=86400000
